name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CF_WORKER: nebari-docs
  CF_CLASSIC_WORKER: nebari-docs-classic

jobs:
  docs:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so Starlight's "last updated" dates come from git.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: docs

      - name: Test (builds both sites into dist/ and dist-classic/)
        run: bun test test
        working-directory: docs
        env:
          # Each site sets its own SITE (www.nebari.dev / classic.nebari.dev) in astro.config.mjs.
          BASE: /
          # `bun test` would otherwise set NODE_ENV=test for the build it runs, which
          # makes Astro build in dev mode and drops the Pagefind search UI from every
          # page. The test suite forces this too; set it here as well so the value is
          # visible on the step that produces the deployed `dist/`.
          NODE_ENV: production

      - name: Compute preview alias
        id: site
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          ALIAS=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-50 | sed -e 's/^-*//' -e 's/-*$//')
          echo "alias=${ALIAS}" >> "$GITHUB_OUTPUT"

      - name: Determine deployability
        id: candeploy
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OK=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ -z "${CF_TOKEN}" ] || [ -z "${CF_ACCOUNT}" ] || [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              OK=false
              echo "::notice::Cloudflare secrets unavailable; skipping preview deploy (build still gates)."
            fi
          fi
          echo "ok=${OK}" >> "$GITHUB_OUTPUT"

      - name: Upload preview version to the nebari-docs Worker
        id: preview-deploy
        if: ${{ github.ref != 'refs/heads/main' && steps.candeploy.outputs.ok == 'true' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          # A brand-new Worker can't accept `versions upload`; seed it with a
          # one-time `deploy` if it doesn't exist yet.
          preCommands: npx wrangler deployments list > /dev/null 2>&1 || npx wrangler deploy
          command: versions upload --preview-alias ${{ steps.site.outputs.alias }}

      - name: Extract preview URL
        id: preview
        if: ${{ steps.preview-deploy.outcome == 'success' }}
        env:
          WRANGLER_OUTPUT: ${{ steps.preview-deploy.outputs.command-output }}
        run: |
          URL=$(printf '%s\n' "$WRANGLER_OUTPUT" | grep -Eo 'https://[a-zA-Z0-9-]+\.[a-zA-Z0-9-]+\.workers\.dev' | tail -n1)
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "::notice::Preview URL: ${URL}"

      - name: Deploy production to the nebari-docs Worker
        id: deploy
        if: ${{ github.ref == 'refs/heads/main' && steps.candeploy.outputs.ok == 'true' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: deploy

      - name: Upload preview version to the nebari-docs-classic Worker
        id: classic-preview-deploy
        if: ${{ github.ref != 'refs/heads/main' && steps.candeploy.outputs.ok == 'true' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          # Same one-time seeding as the main Worker above.
          preCommands: npx wrangler deployments list --config wrangler.classic.jsonc > /dev/null 2>&1 || npx wrangler deploy --config wrangler.classic.jsonc
          command: versions upload --config wrangler.classic.jsonc --preview-alias ${{ steps.site.outputs.alias }}

      - name: Extract Classic preview URL
        id: classic-preview
        if: ${{ steps.classic-preview-deploy.outcome == 'success' }}
        env:
          WRANGLER_OUTPUT: ${{ steps.classic-preview-deploy.outputs.command-output }}
        run: |
          URL=$(printf '%s\n' "$WRANGLER_OUTPUT" | grep -Eo 'https://[a-zA-Z0-9-]+\.[a-zA-Z0-9-]+\.workers\.dev' | tail -n1)
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "::notice::Classic preview URL: ${URL}"

      - name: Deploy production to the nebari-docs-classic Worker
        id: classic-deploy
        if: ${{ github.ref == 'refs/heads/main' && steps.candeploy.outputs.ok == 'true' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: deploy --config wrangler.classic.jsonc

      - name: Comment preview URL
        if: ${{ github.event_name == 'pull_request' && steps.preview-deploy.outcome == 'success' && steps.classic-preview-deploy.outcome == 'success' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: docs-preview
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            **Docs preview** for `${{ github.event.pull_request.head.ref }}`:
            - Nebari (via the `${{ env.CF_WORKER }}` Worker): ${{ steps.preview.outputs.url }}
            - Nebari Classic (via the `${{ env.CF_CLASSIC_WORKER }}` Worker): ${{ steps.classic-preview.outputs.url }}
